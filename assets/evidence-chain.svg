<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OJTS 公开开发证据链</title>
  <desc id="desc">2,230 人参与题目探索，278 道候选内容，经 25,568 人数据筛选后形成 48 道正式题。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5B78"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#F6F8FC"/>
  <text x="64" y="74" fill="#172033" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="34" font-weight="700">从候选内容到正式量表</text>
  <text x="64" y="112" fill="#4A5B78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">OJTS 开发方公开的过程数字 · 逐项可回到来源页面核查</text>

  <g fill="none" stroke="#4A5B78" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 302 310 H 330"/>
    <path d="M 580 310 H 608"/>
    <path d="M 858 310 H 886"/>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect x="60" y="205" width="236" height="210" rx="20" fill="#FFFFFF" stroke="#B8C6EC" stroke-width="2"/>
    <rect x="338" y="205" width="236" height="210" rx="20" fill="#FFFFFF" stroke="#A7D5D0" stroke-width="2"/>
    <rect x="616" y="205" width="236" height="210" rx="20" fill="#FFFFFF" stroke="#E7C88B" stroke-width="2"/>
    <rect x="894" y="205" width="236" height="210" rx="20" fill="#FFFFFF" stroke="#B8C6EC" stroke-width="2"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="84" y="245" fill="#4A5B78" font-size="16" font-weight="700">01 · 题目探索</text>
    <text x="84" y="316" fill="#243B78" font-size="43" font-weight="750">2,230</text>
    <text x="84" y="356" fill="#172033" font-size="20" font-weight="650">人参与题目探索</text>
    <text x="84" y="386" fill="#56627A" font-size="15">提交候选题目与意见</text>

    <text x="362" y="245" fill="#4A5B78" font-size="16" font-weight="700">02 · 候选池</text>
    <text x="362" y="316" fill="#176B63" font-size="43" font-weight="750">278</text>
    <text x="362" y="356" fill="#172033" font-size="20" font-weight="650">道候选内容</text>
    <text x="362" y="386" fill="#56627A" font-size="15">等待筛选的题目集合</text>

    <text x="640" y="245" fill="#4A5B78" font-size="16" font-weight="700">03 · 数据筛选</text>
    <text x="640" y="316" fill="#8B5B08" font-size="43" font-weight="750">25,568</text>
    <text x="640" y="356" fill="#172033" font-size="20" font-weight="650">人数据筛选</text>
    <text x="640" y="386" fill="#56627A" font-size="15">用于比较与缩减题目</text>

    <text x="918" y="245" fill="#4A5B78" font-size="16" font-weight="700">04 · 正式量表</text>
    <text x="918" y="316" fill="#243B78" font-size="43" font-weight="750">48</text>
    <text x="918" y="356" fill="#172033" font-size="20" font-weight="650">道正式题</text>
    <text x="918" y="386" fill="#56627A" font-size="15">40 道陈述 + 8 道双极</text>
  </g>

  <rect x="60" y="498" width="1070" height="100" rx="16" fill="#E9EDF6"/>
  <circle cx="94" cy="548" r="17" fill="#243B78"/>
  <text x="94" y="554" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700">i</text>
  <text x="126" y="542" fill="#172033" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="650">数字来自 OJTS 开发方公开页面，不代表独立临床认证。</text>
  <text x="126" y="570" fill="#56627A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15">它们说明开发过程可追溯，不等同于医疗、招聘或高风险决策效度。</text>
</svg>
