<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">虚构的 INTP 结果预览</title>
  <desc id="desc">INTP 原理拆解者。E 12 / I 27，S 15 / N 29，T 30 / F 14，J 17 / P 25。示例数据，仅用于展示报告样式。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#F6F8FC"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="54" y="48" width="354" height="579" rx="28" fill="#243B78"/>
  <path d="M380 48 H408 V627 H380 Z" fill="#243B78"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="96" y="108" fill="#DCE5FF" font-size="15" font-weight="700">虚构结果预览</text>
    <text x="96" y="196" fill="#FFFFFF" font-size="57" font-weight="800" letter-spacing="3">INTP</text>
    <text x="96" y="242" fill="#FFFFFF" font-size="27" font-weight="700">原理拆解者</text>
    <line x1="96" y1="282" x2="336" y2="282" stroke="#7F95D1" stroke-width="2"/>
    <text x="96" y="326" fill="#DCE5FF" font-size="16">原始类型</text>
    <text x="96" y="358" fill="#FFFFFF" font-size="22" font-weight="700">I · N · T · P</text>
    <text x="96" y="414" fill="#DCE5FF" font-size="16">阅读方式</text>
    <text x="96" y="446" fill="#FFFFFF" font-size="18" font-weight="650">观察偏好，不贴标签</text>
    <text x="96" y="478" fill="#FFFFFF" font-size="18" font-weight="650">查看分差，不藏边界</text>

    <text x="458" y="108" fill="#172033" font-size="28" font-weight="750">八极分数</text>
    <text x="458" y="139" fill="#56627A" font-size="15">每一行展示一组相对偏好</text>

    <text x="458" y="207" fill="#172033" font-size="20" font-weight="700">E 12 / I 27</text>
    <rect x="458" y="225" width="580" height="14" rx="7" fill="#E5EAF3"/>
    <path d="M 465 225 H 636 V 239 H 465 Q 458 239 458 232 V 232 Q 458 225 465 225 Z" fill="#A2AFC7"/>
    <path d="M 636 225 H 1031 Q 1038 225 1038 232 V 232 Q 1038 239 1031 239 H 636 Z" fill="#5069AC"/>
    <text x="1062" y="239" fill="#243B78" font-size="14" font-weight="700">I</text>

    <text x="458" y="289" fill="#172033" font-size="20" font-weight="700">S 15 / N 29</text>
    <rect x="458" y="307" width="580" height="14" rx="7" fill="#E5EAF3"/>
    <path d="M 465 307 H 656 V 321 H 465 Q 458 321 458 314 V 314 Q 458 307 465 307 Z" fill="#A2AFC7"/>
    <path d="M 656 307 H 1031 Q 1038 307 1038 314 V 314 Q 1038 321 1031 321 H 656 Z" fill="#2C8178"/>
