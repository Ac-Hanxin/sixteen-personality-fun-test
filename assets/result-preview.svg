    <rect x="458" y="389" width="580" height="14" rx="7" fill="#E5EAF3"/>
    <path d="M 465 389 H 853 V 403 H 465 Q 458 403 458 396 V 396 Q 458 389 465 389 Z" fill="#B77A16"/>
    <path d="M 853 389 H 1031 Q 1038 389 1038 396 V 396 Q 1038 403 1031 403 H 853 Z" fill="#A2AFC7"/>
