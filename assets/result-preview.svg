    <text x="458" y="453" fill="#172033" font-size="20" font-weight="700">J 17 / P 25</text>
    <rect x="458" y="471" width="580" height="14" rx="7" fill="#E5EAF3"/>
    <path d="M 465 471 H 693 V 485 H 465 Q 458 485 458 478 V 478 Q 458 471 465 471 Z" fill="#A2AFC7"/>
    <path d="M 693 471 H 1031 Q 1038 471 1038 478 V 478 Q 1038 485 1031 485 H 693 Z" fill="#5069AC"/>
